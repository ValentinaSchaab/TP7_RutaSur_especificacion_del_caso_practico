# RutaSur - seguimiento de envíos orientado a eventos
#   Todo:                  docker compose up -d --build
#   4.º indicador (replay): docker compose --profile reproceso up -d analitica-tiempos

x-servicio: &servicio
  build:
    context: .
    dockerfile: docker/Dockerfile.backend
  image: rutasur-backend:local
  restart: unless-stopped # si Kafka tarda en arrancar y el servicio falla, Docker lo reintenta
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_healthy
  environment: &env
    KAFKA_BROKERS: kafka:19092
    MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
    SIM_FACTOR: "120" # 1 hora simulada = 30 segundos reales (lo usan el simulador y el monitor de SLA)

services:
  # ---------- Kafka (KRaft, 1 broker, sin ZooKeeper) ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data # el log sobrevive a reinicios (hace falta para el replay)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init: # crea los topics y termina
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rutasur
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # ---------- MongoDB (replica set de 1 nodo: hace falta para transacciones y change streams) ----------
  mongo:
    image: mongo:4.4 # 4.4 corre en CPUs sin AVX (mongo 5+ falla con exit 132)
    container_name: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Si el replica set ya responde sale OK; si no, lo inicializa y sale 1 (reintenta).
      test: >
        mongo --quiet --eval
        "try { var s = rs.status(); if (s.ok == 1) { quit(0) } } catch (e) {} rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ---------- Simulador (parte del entregable) y servicios: un proceso Node.js cada uno ----------
  simulador:
    <<: *servicio
    command: ["node", "dist/bin.js", "simulador"]
    ports:
      - "4000:4000" # API de control: escenarios de la demo
    environment:
      <<: *env
      SIM_SEED: "42"
      SIM_ENVIOS_POR_MINUTO: "20"

  proyector:
    <<: *servicio
    command: ["node", "dist/bin.js", "proyector"]

  notificaciones:
    <<: *servicio
    command: ["node", "dist/bin.js", "notificaciones"]

  reprogramacion:
    <<: *servicio
    command: ["node", "dist/bin.js", "reprogramacion"]

  monitor-sla:
    <<: *servicio
    command: ["node", "dist/bin.js", "monitor-sla"]

  analitica:
    <<: *servicio
    command: ["node", "dist/bin.js", "analitica"]

  # ---------- Demo de reprocesamiento: 4.º indicador (no arranca con "up" a secas) ----------
  analitica-tiempos:
    <<: *servicio
    profiles: ["reproceso"]
    command: ["node", "dist/bin.js", "analitica-tiempos"]

volumes:
  mongo-data:
  kafka-data:
